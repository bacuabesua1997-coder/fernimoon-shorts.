name: FERNIMOON STUDIO - Create Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề video (kịch bản và giọng đọc sẽ bằng tiếng Anh)"
        required: true
        type: string
      mode:
        description: "Chế độ sản xuất"
        required: true
        default: documentary
        type: choice
        options:
          - documentary
          - football
      match_date:
        description: "Ngày thi đấu YYYY-MM-DD; bỏ trống để dùng hôm nay"
        required: false
        type: string
      duration:
        description: "Thời lượng video (giây)"
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "45"
          - "60"
          - "75"
          - "90"
      football_format:
        description: "Dạng nội dung Football Mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - global_roundup
          - breaking_news
          - transfer_watch
          - match_preview
          - match_recap
          - tactical_analysis
          - player_spotlight
          - club_business
          - drama
          - academy
          - history_facts
      story_style:
        description: "Phong cách nội dung: bí ẩn / lịch sử / khoa học"
        required: true
        default: mystery
        type: choice
        options:
          - mystery
          - history
          - science
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fernimoon-render-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-short:
    # Explicit one-time run after this fix merges; ordinary future pushes skip.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[FERNIMOON-BEK-ONCE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FOOTBALL_ELEVENLABS_VOICE_ID: ${{ secrets.FOOTBALL_ELEVENLABS_VOICE_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FERNIMOON_MODE: ${{ github.event_name == 'push' && 'documentary' || inputs.mode }}
          SHORTS_TOPIC: ${{ github.event_name == 'push' && 'The Origin of the Black-Eyed Children Legend' || inputs.topic }}
          SHORTS_DURATION: ${{ github.event_name == 'push' && '40' || inputs.duration }}
          SHORTS_STYLE: ${{ github.event_name == 'push' && 'mystery' || inputs.story_style }}
          FOOTBALL_FORMAT: ${{ github.event_name == 'push' && 'auto' || inputs.football_format }}
          FOOTBALL_NEWS_FEEDS: ${{ vars.FOOTBALL_NEWS_FEEDS }}
          FOOTBALL_NEWS_ALLOWED_DOMAINS: ${{ vars.FOOTBALL_NEWS_ALLOWED_DOMAINS }}
        run: |
          python - <<'PY'
          import os
          from fernimoon.config import Config, PipelineError, validate_topic
          try:
              Config.from_env(
                  duration=int(os.environ['SHORTS_DURATION']),
                  mode=os.environ.get('FERNIMOON_MODE', 'documentary'),
                  football_format=os.environ.get('FOOTBALL_FORMAT', 'auto'),
              )
              validate_topic(os.environ['SHORTS_TOPIC'])
          except PipelineError as error:
              raise SystemExit(str(error)) from None
          print('Configuration is present; credentials are not printed.')
          PY
      - name: Install original illustration renderer
        run: python -m pip install Pillow==11.3.0
      - name: Install video renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Restore Pixabay search cache (24-hour TTL enforced in code)
        uses: actions/cache@v4
        with:
          path: output/fernimoon/pixabay-cache
          key: pixabay-film-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pixabay-film-v1-
      - name: Test pipeline without calling paid APIs
        run: python -m unittest discover -s fernimoon/tests -v
      - name: Generate English Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FOOTBALL_ELEVENLABS_VOICE_ID: ${{ secrets.FOOTBALL_ELEVENLABS_VOICE_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FERNIMOON_MODE: ${{ github.event_name == 'push' && 'documentary' || inputs.mode }}
          FOOTBALL_DATE: ${{ inputs.match_date }}
          FOOTBALL_FORMAT: ${{ github.event_name == 'push' && 'auto' || inputs.football_format }}
          FOOTBALL_NEWS_FEEDS: ${{ vars.FOOTBALL_NEWS_FEEDS }}
          FOOTBALL_NEWS_ALLOWED_DOMAINS: ${{ vars.FOOTBALL_NEWS_ALLOWED_DOMAINS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          SHORTS_TOPIC: ${{ github.event_name == 'push' && 'The Origin of the Black-Eyed Children Legend' || inputs.topic }}
          SHORTS_DURATION: ${{ github.event_name == 'push' && '40' || inputs.duration }}
          SHORTS_STYLE: ${{ github.event_name == 'push' && 'mystery' || inputs.story_style }}
        # Treat topic as an environment value, never as interpolated shell code.
        run: python -m fernimoon --mode "$FERNIMOON_MODE" --duration "$SHORTS_DURATION" --date "$FOOTBALL_DATE" --format "$FOOTBALL_FORMAT"
      - name: Download MP4 and companion files
        uses: actions/upload-artifact@v4
        with:
          name: FERNIMOON-STUDIO-${{ github.run_number }}
          path: output/fernimoon/*/delivery/*
          if-no-files-found: error
          retention-days: 14
      - name: Add download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## FERNIMOON STUDIO
          Video đã hoàn tất: **1080 × 1920, H.264/AAC, phụ đề động theo giọng đọc**.
          Football Mode hỗ trợ tin tức, chuyển nhượng, drama, cầu thủ, phân tích và dữ liệu trận đấu toàn cầu.
          Thời lượng Football Mode: 30, 45, 60, 75 hoặc 90 giây. Mỗi cảnh có tham chiếu nguồn dữ liệu.
          News Mode dùng RSS từ các nhà xuất bản được cho phép; nguồn báo chí được phân biệt với xác nhận chính thức.
          Không có watermark kênh chạy xuyên video.
          Mở **Artifacts** ở cuối trang lần chạy này, tải gói `FERNIMOON-STUDIO-*` và giải nén MP4.
          Gói cũng có phụ đề SRT/ASS, kịch bản, tiêu đề và nguồn video Pixabay.
          Xem lại nội dung, phần crop dọc và nguồn tư liệu trước khi đăng YouTube.
          EOF
